# Run the whole game locally for E2E:  docker compose up --build
# Frontend → http://localhost:3000   Backend → http://localhost:8080
# Set PROGOLF_JWT_SECRET in a root .env file before starting Compose.

services:
  backend:
    build:
      context: ./backend
    environment:
      # HS256 needs >= 32 chars. Compose fails clearly if it is absent or empty.
      PROGOLF_JWT_SECRET: "${PROGOLF_JWT_SECRET:?Set PROGOLF_JWT_SECRET in .env}"
      PROGOLF_USERS_DIR: /data/users
      PROGOLF_SAVES_DIR: /data/saves
      # Opt-in only for newly created test worlds; existing saves retain their pinned generator.
      PROGOLF_REFINED_V5_NEW_WORLDS: "${PROGOLF_REFINED_V5_NEW_WORLDS:-false}"
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # The BFF calls the backend server-side over the compose network.
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:

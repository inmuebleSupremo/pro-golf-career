spring.application.name=pro-golf-backend
# Provisional app shell: expose only the health endpoint until auth locks actuator down.
management.endpoints.web.exposure.include=health
# GraphQL is the primary API; GraphiQL is the manual explorer at /graphiql (dev convenience).
spring.graphql.graphiql.enabled=true

# Authentication (spec: authentication). Accounts persist as JSON files (Postgres adapter comes later).
progolf.users.dir=${PROGOLF_USERS_DIR:./users}
# JWT signing secret (HS256 needs >= 256 bits / 32 chars). Required from the environment for normal startup.
progolf.auth.jwt.secret=${PROGOLF_JWT_SECRET}
# Access token: short-lived (15 min). Refresh token: long-lived (14 days).
progolf.auth.jwt.access-ttl-seconds=${PROGOLF_JWT_ACCESS_TTL:900}
progolf.auth.jwt.refresh-ttl-seconds=${PROGOLF_JWT_REFRESH_TTL:1209600}

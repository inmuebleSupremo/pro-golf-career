# Tests write autosaves under the build dir so nothing leaks into the project root.
progolf.saves.dir=target/test-saves
# Accounts and a fixed test secret under the build dir, isolated from any local ./users.
progolf.users.dir=target/test-users
progolf.auth.jwt.secret=test-only-secret-for-junit-0123456789abcdefghijklmnop
